<svg width="100%" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="skyGlow" cx="38%" cy="35%" r="75%">
<stop offset="0%" stop-color="#173B45"/>
<stop offset="45%" stop-color="#0E2028"/>
<stop offset="100%" stop-color="#070C10"/>
</radialGradient>
<linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#3FE8D0"/>
<stop offset="100%" stop-color="#0F8C7A"/>
</linearGradient>
<linearGradient id="limbGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#2FCDB6"/>
<stop offset="100%" stop-color="#0D7568"/>
</linearGradient>
<radialGradient id="antennaGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#B8FFF2" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#3FE8D0" stop-opacity="0"/>
</radialGradient>
<radialGradient id="orbGlowA" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#2A5A52" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#2A5A52" stop-opacity="0"/>
</radialGradient>
<radialGradient id="orbGlowB" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#3A3A6B" stop-opacity="0.4"/>
<stop offset="100%" stop-color="#3A3A6B" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="1200" height="400" fill="url(#skyGlow)"/>

<!-- soft floating nebula orbs -->
<circle cx="980" cy="90" r="140" fill="url(#orbGlowA)"/>
<circle cx="150" cy="330" r="120" fill="url(#orbGlowB)"/>
<circle cx="1080" cy="330" r="90" fill="url(#orbGlowA)"/>

<!-- stars -->
<g fill="#EAF7F4">
<circle cx="120" cy="60" r="1.4" opacity="0.6"/><circle cx="260" cy="40" r="1.8" opacity="0.5"/>
<circle cx="700" cy="50" r="1.4" opacity="0.5"/><circle cx="820" cy="90" r="1.8" opacity="0.4"/>
<circle cx="1000" cy="240" r="1.4" opacity="0.5"/><circle cx="60" cy="200" r="1.8" opacity="0.4"/>
<circle cx="450" cy="70" r="1.4" opacity="0.5"/><circle cx="1120" cy="120" r="1.6" opacity="0.5"/>
</g>

<!-- faint synaptic network, background layer -->
<g stroke="#3FE8D0" stroke-width="0.6" opacity="0.18">
<line x1="60" y1="120" x2="220" y2="180"/><line x1="220" y1="180" x2="150" y2="290"/>
<line x1="220" y1="180" x2="380" y2="130"/><line x1="850" y1="140" x2="950" y2="90"/>
<line x1="950" y1="90" x2="1080" y2="150"/><line x1="850" y1="140" x2="900" y2="260"/>
</g>
<g fill="#3FE8D0" opacity="0.4">
<circle cx="60" cy="120" r="3"/><circle cx="220" cy="180" r="4"/><circle cx="150" cy="290" r="3"/>
<circle cx="380" cy="130" r="3"/><circle cx="850" cy="140" r="3"/><circle cx="950" cy="90" r="4"/>
<circle cx="1080" cy="150" r="3"/><circle cx="900" cy="260" r="3"/>
</g>

<!-- name + tagline -->
<text x="90" y="195" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="300" fill="#EAF7F4" letter-spacing="4">BARAA ABID</text>
<text x="90" y="230" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5FBFAE" letter-spacing="3">ML ENGINEER  /  AI ENGINEER</text>
<text x="90" y="270" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3E6B64" letter-spacing="1">Fairness-aware ML · Systems that scale · Signal from noise</text>

<!-- mascot cleanly integrated with fixed animation -->
<g transform="translate(880,90) scale(0.62)">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="3s" repeatCount="indefinite"/>
    
    <circle cx="340" cy="215" r="30" fill="url(#antennaGlow)">
      <animate attributeName="r" values="26;34;26" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="340" y1="215" x2="340" y2="165" stroke="#3FE8D0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="340" cy="160" r="9" fill="#EAF7F4"/>
    
    <ellipse cx="255" cy="315" rx="18" ry="42" fill="url(#limbGrad)" transform="rotate(18 255 300)"/>
    <ellipse cx="425" cy="315" rx="18" ry="42" fill="url(#limbGrad)" transform="rotate(-18 425 300)"/>
    <ellipse cx="300" cy="410" rx="20" ry="34" fill="url(#limbGrad)"/>
    <ellipse cx="380" cy="410" rx="20" ry="34" fill="url(#limbGrad)"/>
    <ellipse cx="300" cy="438" rx="22" ry="12" fill="#0D7568"/>
    <ellipse cx="380" cy="438" rx="22" ry="12" fill="#0D7568"/>
    
    <ellipse cx="340" cy="300" rx="105" ry="98" fill="url(#bodyGrad)"/>
    
    <g>
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.92;0.95;0.98;1" dur="4s" repeatCount="indefinite"/>
      <ellipse cx="308" cy="270" rx="12" ry="15" fill="#08202A"/>
      <ellipse cx="372" cy="270" rx="12" ry="15" fill="#08202A"/>
      <circle cx="311" cy="266" r="3.5" fill="#EAF7F4"/>
      <circle cx="375" cy="266" r="3.5" fill="#EAF7F4"/>
    </g>
    
    <path d="M318,320 Q340,335 362,320" stroke="#08202A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="270" cy="290" rx="10" ry="7" fill="#7FF0DC" opacity="0.35"/>
    <ellipse cx="410" cy="290" rx="10" ry="7" fill="#7FF0DC" opacity="0.35"/>
  </g>
</g>
</svg>
